name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main — a stacked PR based on
  # another feature branch was silently getting no build at all
  pull_request:

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check docs
        run: npm run check:docs

      - name: Check snippet
        run: npm run check:snippet

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build
